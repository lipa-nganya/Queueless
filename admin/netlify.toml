# Config for the admin site (queueless-kenya-admin), which builds with
# base = "admin" so Netlify reads this file instead of the one at the repo root.
[build]
  publish = "."
  command = "echo Static site - no build"

# The admin UI is a single-page app routed by hash, so every path serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
