# Netlify static site (shared build config for both sites)
# Production: queueless-kenya  → branch main    → https://queueless.co.ke
# Dev:        queueless-kenya-dev → branch develop → https://queueless.thewolfgang.tech
#
# Site root = Queueless landing page.
# Customer product app = separate Netlify site (customer.thewolfgang.tech)
# Vendor product app   = separate Netlify site (vendor.queueless.thewolfgang.tech)
#
# Required env vars (both sites):
#   GMAIL_USER          — Gmail address used to send
#   GMAIL_APP_PASSWORD  — Gmail App Password (not your normal password)
#   NOTIFY_TO           — inbox that receives waitlist alerts (optional; defaults to GMAIL_USER)

[build]
  publish = "."
  command = "npm install"
  functions = "netlify/functions"

# Keep /app and /customer working on the landing host by sending people to the
# dedicated customer develop subdomain.
[[redirects]]
  from = "/app"
  to = "https://customer.thewolfgang.tech/"
  status = 302

[[redirects]]
  from = "/app/*"
  to = "https://customer.thewolfgang.tech/:splat"
  status = 302

[[redirects]]
  from = "/customer"
  to = "https://customer.thewolfgang.tech/"
  status = 302

[[redirects]]
  from = "/customer/*"
  to = "https://customer.thewolfgang.tech/:splat"
  status = 302

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/landing.css"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/landing-config.js"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[functions]
  node_bundler = "esbuild"
