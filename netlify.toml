# Netlify static site (shared build config for both sites)
# Production: queueless-kenya  → branch main    → https://queueless.co.ke
# Dev:        queueless-kenya-dev → branch develop → https://queueless.thewolfgang.tech
#
# Required env vars (both sites):
#   GMAIL_USER          — Gmail address used to send
#   GMAIL_APP_PASSWORD  — Gmail App Password (not your normal password)
#   NOTIFY_TO           — inbox that receives waitlist alerts (optional; defaults to GMAIL_USER)

[build]
  publish = "."
  command = "npm install"
  functions = "netlify/functions"

# The dev site previews the customer app at its root instead of the
# coming-soon page. Scoped to develop so main keeps serving the landing page.
[context."develop"]
  publish = "customer"

[functions]
  node_bundler = "esbuild"
