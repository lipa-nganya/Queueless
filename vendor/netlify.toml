# Config for the vendor site (queueless-kenya-vendor), which builds with
# base = "vendor" so Netlify reads this file instead of the one at the repo root.
# Dev URL: https://vendor.queueless.thewolfgang.tech
[build]
  publish = "."
  command = "echo Static site - no build"

# Keep the messaging service worker and its config as real files (not SPA fallback).
[[redirects]]
  from = "/firebase-messaging-sw.js"
  to = "/firebase-messaging-sw.js"
  status = 200
  force = false

[[redirects]]
  from = "/firebase-web-config.js"
  to = "/firebase-web-config.js"
  status = 200
  force = false

# The vendor UI is a single-page app routed by hash, so every path serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/firebase-messaging-sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/firebase-web-config.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
