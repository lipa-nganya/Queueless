<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Queueless Kenya — Coming Soon</title>
    <meta
      name="description"
      content="Queueless Kenya is coming soon. Smart service. Zero wait."
    />
    <link rel="icon" href="assets/queueless-logo.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --void: #000000;
        --void-soft: #0a0a0a;
        --lime: #b6e63a;
        --lime-deep: #8fbf1f;
        --lime-glow: rgba(182, 230, 58, 0.22);
        --white: #ffffff;
        --white-dim: rgba(255, 255, 255, 0.68);
        --white-faint: rgba(255, 255, 255, 0.38);
        --line: rgba(255, 255, 255, 0.14);
        --font: "Montserrat", sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        font-family: var(--font);
        color: var(--white);
        background: var(--void);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }

      .stage {
        position: relative;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: clamp(1.5rem, 4vw, 3rem);
        isolation: isolate;
      }

      .sky {
        position: absolute;
        inset: 0;
        z-index: -2;
        background: #000000;
      }

      .glow {
        position: absolute;
        z-index: -1;
        left: 50%;
        top: 28%;
        width: min(70vw, 520px);
        height: min(40vw, 320px);
        translate: -50% -50%;
        background: radial-gradient(
          ellipse at center,
          var(--lime-glow),
          transparent 68%
        );
        filter: blur(8px);
        animation: glow-pulse 6.5s ease-in-out infinite;
        pointer-events: none;
      }

      .content {
        width: min(100%, 36rem);
        text-align: center;
      }

      .logo {
        display: block;
        width: min(58vw, 16rem);
        max-width: 536px;
        height: auto;
        margin-inline: auto;
        image-rendering: auto;
        opacity: 0;
        animation: rise 0.95s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
      }

      .headline {
        margin-top: clamp(1.6rem, 4vw, 2.25rem);
        font-size: clamp(1.15rem, 3vw, 1.45rem);
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        opacity: 0;
        animation: rise 0.95s cubic-bezier(0.22, 1, 0.36, 1) 0.35s forwards;
      }

      .headline .accent {
        color: var(--lime);
      }

      .support {
        margin-top: 0.85rem;
        font-size: clamp(0.95rem, 2.1vw, 1.05rem);
        font-weight: 400;
        line-height: 1.6;
        color: var(--white-dim);
        max-width: 26rem;
        margin-inline: auto;
        opacity: 0;
        animation: rise 0.95s cubic-bezier(0.22, 1, 0.36, 1) 0.5s forwards;
      }

      .cta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.65rem;
        justify-content: center;
        margin-top: clamp(1.6rem, 4vw, 2.2rem);
        opacity: 0;
        animation: rise 0.95s cubic-bezier(0.22, 1, 0.36, 1) 0.65s forwards;
      }

      .cta input {
        flex: 1 1 14rem;
        max-width: 18rem;
        height: 3rem;
        padding: 0 1.1rem;
        border: 1px solid var(--line);
        border-radius: 0;
        background: rgba(0, 0, 0, 0.72);
        color: var(--white);
        font: inherit;
        font-size: 0.9rem;
        font-weight: 500;
        outline: none;
        transition: border-color 0.2s ease, background 0.2s ease;
      }

      .cta input::placeholder {
        color: var(--white-faint);
      }

      .cta input:focus {
        border-color: rgba(182, 230, 58, 0.7);
        background: rgba(0, 0, 0, 0.95);
      }

      .cta button {
        height: 3rem;
        padding: 0 1.45rem;
        border: none;
        border-radius: 0;
        background: var(--lime);
        color: var(--void);
        font-family: var(--font);
        font-weight: 700;
        font-size: 0.78rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
        transition: background 0.2s ease, transform 0.2s ease;
      }

      .cta button:hover {
        background: #c8f04f;
        transform: translateY(-1px);
      }

      .cta button:active {
        transform: translateY(0);
      }

      .note {
        margin-top: 0.85rem;
        font-size: 0.78rem;
        font-weight: 500;
        letter-spacing: 0.04em;
        color: var(--white-faint);
        min-height: 1.2em;
        opacity: 0;
        animation: rise 0.95s cubic-bezier(0.22, 1, 0.36, 1) 0.8s forwards;
      }

      .note.is-success {
        color: var(--lime);
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(1.15rem);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes glow-pulse {
        0%,
        100% {
          opacity: 0.7;
          transform: translate(-50%, -50%) scale(1);
        }
        50% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1.08);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .glow,
        .logo,
        .headline,
        .support,
        .cta,
        .note {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <div class="sky" aria-hidden="true"></div>
      <div class="glow" aria-hidden="true"></div>

      <div class="content">
        <h1>
          <img
            class="logo"
            src="assets/queueless-logo.png"
            width="536"
            height="462"
            alt="Queueless — Smart Service. Zero Wait."
          />
        </h1>
        <p class="headline">Coming <span class="accent">Soon</span></p>
        <p class="support">
          We're building a smarter way to move through queues across Kenya.
        </p>
        <form class="cta" id="notify-form" novalidate>
          <label
            class="visually-hidden"
            for="email"
            style="
              position: absolute;
              width: 1px;
              height: 1px;
              overflow: hidden;
              clip: rect(0 0 0 0);
            "
          >
            Email address
          </label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="Your email"
            autocomplete="email"
            required
          />
          <button type="submit">Notify me</button>
        </form>
        <p class="note" id="form-note" role="status" aria-live="polite"></p>
      </div>
    </main>

    <script>
      const form = document.getElementById("notify-form");
      const note = document.getElementById("form-note");

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const email = new FormData(form).get("email")?.toString().trim();

        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          note.textContent = "Please enter a valid email.";
          note.classList.remove("is-success");
          return;
        }

        note.textContent = "You're on the list. We'll be in touch.";
        note.classList.add("is-success");
        form.reset();
      });
    </script>
  </body>
</html>
