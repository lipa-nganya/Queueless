<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Queueless">
  <style>
    /* Brand dark green on light tab strips, brighter lime on dark ones. */
    .q { stroke: #7eb000; }
    @media (prefers-color-scheme: dark) {
      .q { stroke: #a6e600; }
    }
  </style>
  <g class="q" fill="none" stroke-width="5.5" stroke-linecap="round">
    <circle cx="15.5" cy="15.5" r="9" />
    <path d="M19 19 25 25" />
  </g>
</svg>
