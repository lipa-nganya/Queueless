services:
  db:
    image: postgres:16-alpine
    container_name: queueless-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: queueless
      POSTGRES_PASSWORD: queueless_dev
      POSTGRES_DB: queueless
    ports:
      - "5434:5432"
    volumes:
      - queueless_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queueless -d queueless"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: queueless-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@queueless.co.ke
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  queueless_pgdata:
